# ---- TECS (Total Energy Control System) ----
# 参考 ArduPilot TECS_* 参数（针对 TB2/Predator 级无人机调优）
TECS_CLMB_MAX: 3.0        # 最大爬升率 (m/s) – 限制以减少动能积累和超调
TECS_SINK_MIN: 2.0        # 最小下沉率 (m/s)
TECS_SINK_MAX: 3.0        # 最大下沉率 (m/s) – 对称设置
TECS_TIME_CONST: 8.0      # 控制时间常数 (s) – 8.0 使响应更平滑，减小振荡
TECS_THR_DAMP: 0.7        # 油门阻尼（增大至 0.7，减小油门周期性波动）
TECS_PTCH_DAMP: 0.8       # 俯仰阻尼（0.8，强力抑制俯仰振荡）
TECS_INTEG_GAIN: 0.05     # 积分增益（进一步降低至 0.05，彻底消除积分振荡）
TECS_SPDWEIGHT: 1.0       # 速度权重 – 均衡模式（恢复第六轮最优值）
TECS_RLL2THR: 18.0        # 坡度转油门补偿（35° 坡度时 1/cos²(35°)-1≈0.49，18×0.49≈8.8%油门前馈）
TECS_PITCH_MAX: 12.0      # TECS 允许的最大俯仰角 (deg)
TECS_PITCH_MIN: -12.0     # TECS 允许的最小俯仰角 (deg)
TECS_THR_CRUISE: 0.51     # 巡航油门前馈（703N/1373N，含重力X分量，实测配平值）
TECS_HDEM_TCONST: 3.0     # 高度需求低通时间常数 (s) – 增大至 3.0 进一步平滑高度指令跳变
